name: framee
description: "Framee - a social network app built with Flutter and Supabase."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # Storage
  shared_preferences: ^2.3.2

  # Images & Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  path_provider: ^2.1.4
  flutter_image_compress: ^2.3.0

  # UI
  gap: ^3.0.1
  flutter_screenutil: ^5.9.3
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  photo_view: ^0.15.0

  # Utils
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  logger: ^2.4.0
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5
  share_plus: ^10.0.2
  flutter_local_notifications: ^21.0.0
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.0.0
  slang_flutter: ^4.2.0
  country_flags: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  slang: ^4.2.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/framee-logo.png"
  adaptive_icon_background: "#6C4EF6"
  adaptive_icon_foreground: "assets/framee-logo.png"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic